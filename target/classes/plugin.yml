name: DeathPlugin
version: '2.0'
main: com.isilently.deathplugin.DeathPlugin
api-version: 1.21
authors: [ iSilently ]
website: https://github.com/Silent-Alchemist/
commands:
  essence:
    usage: /<command>
    aliases:
      - ess
  essencesend:
    usage: /<command> [Player] [Amount]
    aliases:
      - esssend
  revive:
    usage: /<command> [Player]
    permission: deathplugin.revive
  exchange:
    usage: /<command> [Material] [Amount]
  exchangelist:
    usage: /<command>
  addexchangeitem:
    usage: /<command> [Name] [Value]
    aliases:
      - aei
    permission: deathplugin.addexchangeitem